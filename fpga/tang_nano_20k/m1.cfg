# OpenOCD: Gowin Cortex-M1 on the Tang Nano 20K, CMSIS-DAP probe on SWD
# (SWCLK pin 73, SWDIO pin 74, header J6). No flash: code goes into ITCM.

source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 1000

swd newdap m1 cpu -enable
dap create m1.dap -chain-position m1.cpu
target create m1.cpu cortex_m -dap m1.dap

# SYSRESETREQ resets the core only: ITCM, DTCM and the fabric keep their
# contents. it also clears an active exception, such as the HardFault left by
# the lockup after power on with an empty ITCM
cortex_m reset_config sysresetreq

# load an elf into ITCM/DTCM, then reset: the core starts from the new vectors
proc m1_run {elf} {
  halt
  load_image $elf
  reset run
}
