# OpenOCD: Gowin GoRV32 on the Tang Nano 20K, CMSIS-DAP probe on JTAG
# (TCK pin 73 J6 1, TMS 74 J6 2, TDI 75 J6 3, TDO 76 J5 3). RISC-V debug 0.13.
# No flash: code goes into On-Chip RAM at 0x40000000.

source [find interface/cmsis-dap.cfg]
transport select jtag
adapter speed 1000

jtag newtap rv cpu -irlen 5 -expected-id 0x10002fff
target create rv.cpu riscv -chain-position rv.cpu

# load an elf into On-Chip RAM and run it from its start. halt first: the old
# program does not run while the new one is written over it
proc rv_run {elf} {
  halt
  load_image $elf
  resume 0x40000000
}
